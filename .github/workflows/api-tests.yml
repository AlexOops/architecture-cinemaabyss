name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      COMPOSE_NETWORK: cinemaabyss-network

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Compose version
        run: docker compose --version

      - name: Start services with Docker Compose
        run: |
          set -e
          docker compose up -d --build
          docker compose ps
          docker network ls | grep "${{ env.COMPOSE_NETWORK }}" || true

      - name: Wait for services (HTTP)
        run: |
          set -e
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8081/api/movies/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8082/api/events/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "All services are up"
              exit 0
            fi
            sleep 2
          done

          echo "Services not ready"
          docker compose ps
          docker compose logs --no-color --tail=200 monolith movies-service events-service proxy-service
          exit 1

      - name: Build API tests image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        run: |
          set -e
          mkdir -p reports
          docker run --rm \
            --network="${{ env.COMPOSE_NETWORK }}" \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests -e docker

      - name: Stop services
        if: always()
        run: docker compose down