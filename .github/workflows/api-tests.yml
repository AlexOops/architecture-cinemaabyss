name: API Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Kafka first
        shell: bash
        run: |
          set -e
          docker compose up -d --build zookeeper kafka
          docker compose ps

      - name: Wait for Kafka
        shell: bash
        run: |
          set -e
          for i in $(seq 1 120); do
            if docker compose exec -T kafka bash -lc 'kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1'; then
              echo "Kafka is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka not ready"
          docker compose logs --no-color --tail=200 zookeeper kafka
          exit 1

      - name: Start rest services
        shell: bash
        run: |
          set -e
          docker compose up -d --build
          docker compose ps

      - name: Wait for services (HTTP)
        shell: bash
        run: |
          set -e
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8081/api/movies/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8082/api/events/health >/dev/null 2>&1 && \
               curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "All services are up"
              exit 0
            fi
            sleep 2
          done

          echo "Services not ready"
          docker compose ps
          docker compose logs --no-color --tail=200 monolith movies-service events-service proxy-service
          exit 1

      - name: Detect docker-compose network name
        id: net
        shell: bash
        run: |
          set -e
          COMPOSE_CONTAINER_ID="$(docker compose ps -q | head -n 1 || true)"
          if [[ -z "$COMPOSE_CONTAINER_ID" ]]; then
            echo "No running docker-compose containers found."
            exit 1
          fi
          NETWORK_NAME="$(docker inspect "$COMPOSE_CONTAINER_ID" \
            --format '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' \
            | head -n 1)"
          if [[ -z "$NETWORK_NAME" ]]; then
            echo "Failed to detect docker network from container: $COMPOSE_CONTAINER_ID"
            exit 1
          fi
          echo "network=$NETWORK_NAME" >> $GITHUB_OUTPUT
          echo "Detected Docker network: $NETWORK_NAME"

      - name: Build API tests image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        shell: bash
        run: |
          set -e
          mkdir -p reports
          docker run --rm \
            --network="${{ steps.net.outputs.network }}" \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests --environment docker

      - name: Stop services
        if: always()
        run: docker compose down -v