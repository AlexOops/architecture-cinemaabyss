name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: cinemaabyss
      COMPOSE_NETWORK: cinemaabyss_default

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose --version

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 120

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Build API tests image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker run --rm \
            --network=${{ env.COMPOSE_NETWORK }} \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests

      - name: Stop services
        if: always()
        run: docker compose down