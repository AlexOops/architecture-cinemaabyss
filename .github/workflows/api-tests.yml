name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    env:
      COMPOSE_NETWORK: cinemaabyss-network

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Compose version
        run: docker compose --version

      - name: Ensure network exists
        run: |
          docker network inspect "${{ env.COMPOSE_NETWORK }}" >/dev/null 2>&1 || \
          docker network create "${{ env.COMPOSE_NETWORK }}"

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 120
          docker compose ps
          docker network ls | grep "${{ env.COMPOSE_NETWORK }}" || true

      - name: Build API tests image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        run: |
          set -e
          mkdir -p reports
          docker run --rm \
            --network="${{ env.COMPOSE_NETWORK }}" \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests -d -e docker

      - name: Stop services
        if: always()
        run: docker compose down